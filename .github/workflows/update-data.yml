name: 시세 업데이트

on:
  schedule:
    - cron: "10 7 * * 1-5"    # 평일 16:10 KST — 한국장 마감 후
    - cron: "20 21 * * 1-5"   # 화~토 06:20 KST — 미국장 마감 후
  workflow_dispatch:           # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시세 받기
        run: python update_data.py

      - name: 바뀐 시세 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 시세 없음"
          else
            git commit -m "시세 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
