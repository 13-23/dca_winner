name: 시세 업데이트

on:
  push:
    branches: [main]
    paths:
      - tickers.json
  schedule:
    - cron: "10 8 * * 1-5"    # 평일 17:10 KST — 연구용 한국 종가 확정 기준 이후
    - cron: "10 22 * * 1-5"   # 화~토 07:10 KST — 연구용 미국 종가 확정 기준 이후
  workflow_dispatch:           # Actions 탭에서 "Run workflow"로 바로 실행
    inputs:
      market_only:
        description: "시장 보조지표만 갱신"
        type: boolean
        default: false
      research_only:
        description: "연구용 지수 6개와 시장 보조지표만 갱신"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시세 받기
        if: inputs.market_only != true && inputs.research_only != true
        run: python update_data.py

      - name: 연구용 지수 OHLC 받기
        if: inputs.research_only == true
        run: python update_position_prices.py

      - name: 시장 보조지표 받기
        run: python update_market.py

      - name: 시장 위치 연구용 이력 받기
        run: python update_position_inputs.py

      - name: 시장 위치 순차 검증 갱신
        run: python market_position.py

      - name: 시장별 6개월 반등 검증 갱신
        run: python market_position_v2.py

      - name: 나스닥100 하락·회복 통계 갱신
        run: python drawdown_analysis.py

      - name: 바뀐 시세 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data POSITION_RESULTS.md POSITION_V2_RESULTS.md
          if git diff --cached --quiet; then
            echo "바뀐 시세 없음"
          else
            git commit -m "시세 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
